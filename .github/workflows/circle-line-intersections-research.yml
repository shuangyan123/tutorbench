name: Exact Circle-Line Intersection Research

on:
  pull_request:
    paths:
      - '.github/workflows/circle-line-intersections-research.yml'
      - 'scripts/research/verify_circle_line_intersections.py'
      - 'scripts/research/test_verify_circle_line_intersections.py'
      - 'scripts/research/verify_dual_path_math_answers.py'
      - 'fixtures/research/circle-line-intersections-v0.1.json'
      - 'docs/research/circle-line-intersections-v0.1.md'
      - 'docs/README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independently-verified-geometry-and-index:
    runs-on: ubuntu-latest
    steps:
      - name: Read source without persisted GitHub credential
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install pinned exact mathematics
        run: |
          python3 -m venv "$RUNNER_TEMP/typed-geometry"
          "$RUNNER_TEMP/typed-geometry/bin/pip" install --disable-pip-version-check --no-cache-dir \
            'sympy==1.14.0' 'mpmath==1.3.0'
      - name: Test two exact geometric solvers, source-blind adjudication and adversarial counterexamples
        run: |
          timeout 180s "$RUNNER_TEMP/typed-geometry/bin/python" -m unittest \
            scripts/research/test_verify_circle_line_intersections.py \
            scripts/research/test_verify_dual_path_math_answers.py -v
      - name: Recalculate all 23 case verdicts and inspect documentation index
        run: |
          timeout 120s "$RUNNER_TEMP/typed-geometry/bin/python" \
            scripts/research/verify_dual_path_math_answers.py \
            --fixture fixtures/research/circle-line-intersections-v0.1.json \
            --sources fixtures/research/exam-multi-source-evidence-v0.1.json \
            > "$RUNNER_TEMP/geometry-research.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          report=json.loads((Path(os.environ["RUNNER_TEMP"])/"geometry-research.json").read_text(encoding="utf8"))
          expected={
              "total":23,
              "reference_mathematically_verified":2,
              "reference_mathematically_refuted":2,
              "deterministic_no_answer_solution":8,
              "replayed_candidate_mathematically_verified":2,
              "replayed_candidate_mathematically_refuted":2,
              "unverified":7,
              "offlineReplayDecidable":4,
              "offlineReplayCorrect":2,
              "genuineAIModelRuns":0,
              "measuredLiveAIAccuracy":None,
              "officialExamGoldReleased":0,
              "realExamCasesProvenAuthenticated":0,
          }
          assert report["summary"]==expected
          assert all(item["officialExamGoldCertified"] is False and
                     item["liveAIModelCallPerformed"] is False for item in report["items"])
          target="research/circle-line-intersections-v0.1.md"
          index=Path("docs/README.md").read_text(encoding="utf8")
          section=index.split("## Research notes\n",1)[1].split("\n## ",1)[0]
          assert section.count("("+target+")")==1
          assert Path("docs",target).is_file()
          print("Complete bounded point-set verification + dual-path safety; doc indexed; no provider calls")
          PY
