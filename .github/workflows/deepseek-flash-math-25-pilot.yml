name: DeepSeek Flash Blind Math 25 Research

on:
  pull_request:
    paths:
      - '.github/workflows/deepseek-flash-math-25-pilot.yml'
      - 'scripts/research/run_deepseek_flash_math_25.py'
      - 'scripts/research/test_run_deepseek_flash_math_25.py'
      - 'fixtures/research/deepseek-flash-blind-math-25-v0.1.json'
      - 'scripts/research/verify_dual_path_math_answers.py'
      - 'docs/research/deepseek-flash-25-math-real-response-pilot-v0.1.md'
      - 'docs/README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-provider-free-real-runner-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out immutable source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install pinned exact math dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/deepseek-math"
          "$RUNNER_TEMP/deepseek-math/bin/pip" install --disable-pip-version-check --no-cache-dir \
            'sympy==1.14.0' 'mpmath==1.3.0'
      - name: Test frozen 25 typed problems, error classification and no-API opt-in
        run: |
          timeout 180s "$RUNNER_TEMP/deepseek-math/bin/python" -m unittest \
            scripts/research/test_run_deepseek_flash_math_25.py \
            scripts/research/test_measure_math_wrong_answer_detection.py \
            scripts/research/test_verify_dual_path_math_answers.py -v
      - name: Validate no-key 25-question plan only and honest research index
        run: |
          timeout 60s "$RUNNER_TEMP/deepseek-math/bin/python" \
            scripts/research/run_deepseek_flash_math_25.py plan \
            --limit 25 > "$RUNNER_TEMP/deepseek-plan.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          doc=json.loads((Path(os.environ["RUNNER_TEMP"])/"deepseek-plan.json").read_text(encoding="utf8"))
          assert doc["mode"]=="plan_no_provider_calls"
          assert doc["selected"]==25 and doc["noAnswerKeysSent"] is True
          assert doc["estimatedPrice"] is None
          assert len({case["requestSha256"] for case in doc["cases"]})==25
          index=Path("docs/README.md").read_text(encoding="utf8")
          section=index.split("## Research notes\n",1)[1].split("\n## ",1)[0]
          target="research/deepseek-flash-25-math-real-response-pilot-v0.1.md"
          assert section.count("("+target+")")==1
          assert (Path("docs")/target).is_file()
          print("25 answer-blind prompts, no provider calls or fabricated live accuracy")
          PY
