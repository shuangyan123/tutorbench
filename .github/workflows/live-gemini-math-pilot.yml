name: Blind Gemini Local-Host Math Pilot Research

on:
  pull_request:
    paths:
      - '.github/workflows/live-gemini-math-pilot.yml'
      - 'scripts/research/run_local_gemini_math_pilot.py'
      - 'scripts/research/test_run_local_gemini_math_pilot.py'
      - 'fixtures/research/live-blind-occupancy-pilot-v0.1.json'
      - 'docs/research/live-gemini-blind-math-accuracy-v0.1.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blind-packet-provenance-and-simulated-localhost-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out isolated research code without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install bounded symbolic math dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/math-live-pilot"
          "$RUNNER_TEMP/math-live-pilot/bin/pip" install --disable-pip-version-check --no-cache-dir \
            'sympy==1.14.0' 'mpmath==1.3.0'
      - name: Test blind prompts, no-network plan, authenticated loopback stub and exact grading
        run: |
          timeout 180s "$RUNNER_TEMP/math-live-pilot/bin/python" -m unittest \
            scripts/research/test_run_local_gemini_math_pilot.py -v
      - name: Verify six frozen answer-free prompts without executing or configuring Gemini
        run: |
          "$RUNNER_TEMP/math-live-pilot/bin/python" \
            scripts/research/run_local_gemini_math_pilot.py plan \
            --suite fixtures/research/live-blind-occupancy-pilot-v0.1.json \
            > "$RUNNER_TEMP/math-blind-plan.json"
          python3 - <<'PY'
          import json,os
          with open(os.path.join(os.environ['RUNNER_TEMP'],'math-blind-plan.json'),
                    encoding='utf8') as f: plan=json.load(f)
          assert plan['mode']=='plan'
          assert plan['requestsSent']==0
          assert plan['totalCases']==6 and plan['selectedCases']==6
          assert plan['answerKeysIncludedInPrompt'] is False
          assert plan['modelCredentialsRead'] is False
          assert all('61/25' not in row['prompt'] for row in plan['selected'])
          print('Six blind cases ready; zero external model calls and zero fabricated AI accuracy')
          PY
