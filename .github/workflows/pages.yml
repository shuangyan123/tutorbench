name: Tutor Benchmark Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build GitHub Pages artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      indexnow: ${{ steps.indexnow.outputs.payload }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node 24.21.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.21.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build public website
        env:
          TUTOR_BENCHMARK_SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          TUTOR_BENCHMARK_SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: npm run website:build
      - name: Check deployment artifact
        run: node scripts/website-artifact-smoke.mjs
      # compared with the live site before this deploy replaces it; a failure only skips the ping
      - name: List the pages this deploy changes (IndexNow)
        id: indexnow
        if: github.ref == 'refs/heads/main' && steps.pages.outputs.base_url == 'https://teachometry.com'
        continue-on-error: true
        run: node dist/src/cli/indexnow.js website/dist https://teachometry.com >> "$GITHUB_OUTPUT"
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist

  deploy:
    name: Deploy GitHub Pages artifact
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Bing and the other IndexNow engines crawl the changed pages within hours; Google does not use IndexNow
  indexnow:
    name: Tell search engines which pages changed
    if: github.ref == 'refs/heads/main' && needs.build.outputs.indexnow != ''
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Submit to IndexNow
        continue-on-error: true
        env:
          PAYLOAD: ${{ needs.build.outputs.indexnow }}
        run: >-
          curl --fail-with-body --silent --show-error --max-time 30
          -X POST https://api.indexnow.org/indexnow
          -H 'Content-Type: application/json; charset=utf-8'
          --data "$PAYLOAD"
