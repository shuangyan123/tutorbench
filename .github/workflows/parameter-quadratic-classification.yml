name: Exact Parameter Quadratic Root Family Research

on:
  pull_request:
    paths:
      - '.github/workflows/parameter-quadratic-classification.yml'
      - 'scripts/research/verify_parameter_quadratics.py'
      - 'scripts/research/test_verify_parameter_quadratics.py'
      - 'fixtures/research/parameter-affine-quadratic-real-roots-v0.1.json'
      - 'docs/research/parameter-affine-quadratic-real-roots-v0.1.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-all-parameter-root-classification:
    runs-on: ubuntu-latest
    steps:
      - name: Check out only the research branch code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install isolated exact mathematics dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/math-parameters"
          "$RUNNER_TEMP/math-parameters/bin/pip" install --disable-pip-version-check --no-cache-dir \
            'sympy==1.14.0' 'mpmath==1.3.0'
      - name: Verify exact parameter-axis classification, oracle mutation and coverage
        run: |
          "$RUNNER_TEMP/math-parameters/bin/python" -m unittest \
            scripts/research/test_verify_parameter_quadratics.py -v
      - name: Recompute all 54 expected complete parameter root classifications
        run: |
          "$RUNNER_TEMP/math-parameters/bin/python" \
            scripts/research/verify_parameter_quadratics.py \
            --fixture fixtures/research/parameter-affine-quadratic-real-roots-v0.1.json \
            > "$RUNNER_TEMP/parameter-families.json"
          python3 - <<'PY'
          import json
          import os
          path=os.path.join(os.environ["RUNNER_TEMP"],"parameter-families.json")
          with open(path,encoding="utf8") as handle:
              result=json.load(handle)
          assert result["status"]=="research_exact_parameter_quadratic_root_families_no_exam_gold"
          assert result["summary"]=={
              "total":54,"verifiedComplete":26,"refuted":15,
              "unverified":13,"officialExamGoldReleased":0}
          by_id={row["id"]:row for row in result["items"]}
          assert by_id["quadratic-with-linear-drop-and-double"]["criticalParameters"]==["0","1/4"]
          assert by_id["same-equation-missed-linear-drop"]["parameterWitness"]=="0"
          assert by_id["all-at-t0-missing"]["expectedRootsAtWitness"]=="Reals"
          assert by_id["same-equation-wrong-double-boundary"]["parameterWitness"]=="1/4"
          assert by_id["quadratic-surd-boundaries"]["status"]=="verified_complete_parameter_solution_family"
          assert by_id["gap-at-parameter-zero"]["reason"]=="missing_or_overlapping_parameter_case"
          assert all(row["officialExamGoldCertified"] is False for row in result["items"])
          print("Exact all-real-parameter quadratic root family verified; exam source gold remains unavailable")
          PY
