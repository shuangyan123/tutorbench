name: Typed Symbolic Math Research Checks

on:
  pull_request:
    paths:
      - '.github/workflows/typed-symbolic-math-research.yml'
      - 'scripts/research/verify-typed-symbolic-claims.py'
      - 'scripts/research/test_typed_symbolic_claims.py'
      - 'fixtures/research/typed-symbolic-claim-contract-v0.1.json'
      - 'docs/research/typed-symbolic-verifier-contract-v0.1.md'
      - 'scripts/research/verify-complete-rational-roots.py'
      - 'scripts/research/test_complete_rational_roots.py'
      - 'fixtures/research/bounded-rational-roots-contract-v0.1.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  math-ast-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code without retained GitHub credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Isolate exact research algebra dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/typed-math"
          "$RUNNER_TEMP/typed-math/bin/pip" install --disable-pip-version-check --no-cache-dir 'sympy==1.14.0' 'mpmath==1.3.0'
      - name: Test exact identities, mathematical counterexamples, parsing and abstention
        run: "$RUNNER_TEMP/typed-math/bin/python -m unittest scripts/research/test_typed_symbolic_claims.py -v"
      - name: Smoke typed claim CLI
        run: |
          "$RUNNER_TEMP/typed-math/bin/python" scripts/research/verify-typed-symbolic-claims.py \
            --fixture fixtures/research/typed-symbolic-claim-contract-v0.1.json \
            > "$RUNNER_TEMP/typed-result.json"
          python3 -c "import json,os; d=json.load(open(os.environ['RUNNER_TEMP']+'/typed-result.json')); assert d['summary']=={'total':12,'symbolicallyEqual':3,'counterexamples':2,'unverified':7}; print(d['summary'])"

      - name: Test complete rational solution sets and exam Q16 intermediate claim
        run: "$RUNNER_TEMP/typed-math/bin/python -m unittest scripts/research/test_complete_rational_roots.py -v"
      - name: Smoke rational-root CLI with exact counts
        run: |
          "$RUNNER_TEMP/typed-math/bin/python" scripts/research/verify-complete-rational-roots.py \
            --fixture fixtures/research/bounded-rational-roots-contract-v0.1.json \
            > "$RUNNER_TEMP/roots.json"
          python3 -c "import json,os; d=json.load(open(os.environ['RUNNER_TEMP']+'/roots.json')); assert d['summary']=={'total':15,'verifiedComplete':7,'refuted':4,'unverified':4}; print(d['summary'])"
