<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Premium Runs</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file:; style-src 'self' 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<style>
/* Layout: one sheet of paper on a misty ground, read top to bottom in the order a reviewer asks:
   how did each tutor do, what needs me, every conversation, then how the run itself behaved.
   Status colour lives only in the small per-conversation marks; everything else is ink. */
:root {
  --ground: #dfe5f1;
  --sheet: #fcfcfe;
  --surface: #fcfcfe;
  --surface-2: #f1f3f9;
  --hover: #eef1f8;
  --ink: #15171e;
  --ink-2: #545a6c;
  --ink-3: #8b91a3;
  --rule: #e1e5ee;
  --rule-strong: #c3c9d7;
  --frame: #2a2d38;
  --accent: #3a46a0;
  --accent-wash: #e7eaf7;
  --good: #0aac23;
  --warn: #fbb315;
  --warn-edge: #c98b00;
  --serious: #f18a59;
  --crit: #dc3c3d;
  --crit-ink: #b3292a;
  --shadow: 0 1px 2px rgba(21, 23, 30, .05), 0 12px 32px rgba(40, 52, 96, .08);
  --font: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0e1016; --sheet: #161921; --surface: #161921; --surface-2: #1d212b; --hover: #1f2430;
    --ink: #eceef4; --ink-2: #a5abbd; --ink-3: #737a8e; --rule: #262b36; --rule-strong: #384050; --frame: #4a5163;
    --accent: #a7b0f3; --accent-wash: #252a45; --warn-edge: #fbb315; --crit: #ef5b5c; --crit-ink: #f58a8b;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #0e1016; --sheet: #161921; --surface: #161921; --surface-2: #1d212b; --hover: #1f2430;
  --ink: #eceef4; --ink-2: #a5abbd; --ink-3: #737a8e; --rule: #262b36; --rule-strong: #384050; --frame: #4a5163;
  --accent: #a7b0f3; --accent-wash: #252a45; --warn-edge: #fbb315; --crit: #ef5b5c; --crit-ink: #f58a8b;
  --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--ground); color: var(--ink); font: 14px/1.55 var(--font); -webkit-font-smoothing: antialiased; }
.page { max-width: 1180px; margin: 0 auto; padding-block: 32px 72px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px; }
h1, h2, h3 { margin: 0; text-wrap: balance; letter-spacing: -.01em; }
h1 { font-size: 30px; font-weight: 600; line-height: 1.15; }
h2 { font-size: 18px; font-weight: 600; }
h3 { font-size: 13px; font-weight: 600; }
p { margin: 0; }
.mono { font-family: var(--mono); font-size: 12px; }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.small { font-size: 12px; }
.num { font-variant-numeric: tabular-nums; }
button, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 1px solid var(--rule-strong); background: var(--sheet); border-radius: 6px; padding: 6px 12px; line-height: 1.3; }
button:hover { border-color: var(--ink-3); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
select { border: 1px solid var(--rule-strong); background: var(--sheet); border-radius: 5px; padding: 3px 6px; max-width: 100%; font-size: 13px; }
.kicker { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }

/* Masthead */
.masthead { display: flex; flex-wrap: wrap; gap: 14px 32px; align-items: end; justify-content: space-between; }
.mast-text { display: grid; gap: 6px; min-width: 0; max-width: 72ch; }
.source { color: var(--ink-2); font-size: 13px; }
.banner { display: flex; gap: 8px; align-items: baseline; font-size: 13px; color: var(--ink); }
.banner::before { content: ""; flex: none; width: 7px; height: 7px; transform: rotate(45deg) translateY(-1px); background: var(--accent); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn-primary { background: var(--ink); color: var(--sheet); border-color: var(--ink); display: inline-flex; align-items: center; cursor: pointer; border-radius: 6px; padding: 6px 12px; line-height: 1.3; border-width: 1px; border-style: solid; }
.btn-primary:hover { background: var(--frame); }
.btn-primary:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn-quiet { border-color: transparent; background: none; color: var(--ink-2); }
.btn-quiet:hover { color: var(--ink); border-color: var(--rule-strong); }
.warnings { border-left: 2px solid var(--serious); background: var(--sheet); padding: 10px 14px; font-size: 13px; }
.warnings ul { margin: 6px 0 0; padding-left: 18px; }

/* The sheet */
.sheet { background: var(--sheet); border: 1px solid var(--rule); border-top: 2px solid var(--frame); box-shadow: var(--shadow); min-width: 0; }
.sec { padding: 28px 32px 32px; display: grid; gap: 16px; min-width: 0; }
.sec + .sec { border-top: 1px solid var(--rule); }
.sec-head { display: flex; flex-wrap: wrap; gap: 10px 32px; align-items: end; justify-content: space-between; }
.sec-head > .title { display: grid; gap: 4px; min-width: 0; max-width: 70ch; }
.lede { color: var(--ink-2); font-size: 13px; }
.count { color: var(--ink-3); font-weight: 400; margin-left: 6px; font-variant-numeric: tabular-nums; }
.filters { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.filters label { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; color: var(--ink-2); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--ink-2); align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend .hint { color: var(--ink-3); }
.empty-note { color: var(--ink-2); padding: 8px 0; }

/* Per-conversation marks: shape and colour together, never colour alone */
.pip { width: 12px; height: 12px; flex: none; display: block; overflow: visible; }
.pip.good circle { fill: var(--good); }
.pip.flawed .ring { fill: none; stroke: var(--warn-edge); stroke-width: 1.5; }
.pip.flawed path { fill: var(--warn); }
.pip.fail path { stroke: var(--crit); stroke-width: 2.2; stroke-linecap: round; fill: none; }
.pip.needs_review circle { fill: none; stroke: var(--accent); stroke-width: 1.6; }
.pip.unscorable path, .pip.other_version path { stroke: var(--ink-3); stroke-width: 2; stroke-linecap: round; fill: none; }
.state { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.pip-btn { border: 0; background: none; padding: 3px; border-radius: 4px; line-height: 0; }
.pip-btn:hover { background: var(--hover); }

/* Tables */
.scroll-x { overflow-x: auto; min-width: 0; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--rule); vertical-align: top; }
thead th { font-size: 12px; font-weight: 500; color: var(--ink-2); border-bottom-color: var(--rule-strong); white-space: nowrap; vertical-align: bottom; }
td.num, th.num { text-align: right; }

/* Tutor scorecard */
.board th:first-child, .board td:first-child { position: sticky; left: 0; background: var(--sheet); z-index: 1; padding-left: 0; }
.board td { padding-block: 14px; }
.board .who { display: grid; gap: 2px; min-width: 132px; }
.board .who strong { font-size: 14.5px; font-weight: 600; }
.board .pass { min-width: 168px; display: grid; gap: 6px; }
.board .rate { font-size: 24px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.board .rate.none { color: var(--ink-3); font-size: 18px; }
.board .meter { height: 2px; background: var(--rule); width: 100%; max-width: 160px; }
.board .meter span { display: block; height: 100%; background: var(--ink); }
.board .sub { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.board .cardhead { display: grid; gap: 1px; }
.board .cell { display: grid; gap: 2px; min-width: 96px; }
.board .langrow { display: flex; align-items: center; gap: 2px; }
.board .lang { font-size: 11px; color: var(--ink-3); width: 1.8em; flex: none; }
.board .link { border: 0; background: none; padding: 0; color: var(--accent); font-variant-numeric: tabular-nums; }
.board .link:hover { text-decoration: underline; }
.totals { font-size: 12.5px; color: var(--ink-2); max-width: 90ch; }

/* What needs a person */
.cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 40px; }
.list { display: grid; align-content: start; }
.list > h3 { padding-bottom: 8px; border-bottom: 1px solid var(--rule-strong); }
.list > h3 .count { font-weight: 400; }
.row { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 2px 12px; align-items: baseline; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--rule); border-radius: 0; background: none; padding: 10px 6px; }
.row:hover { background: var(--hover); }
.row .pip { align-self: center; grid-row: 1; }
.row .name { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.row .why { grid-column: 2; color: var(--ink-2); font-size: 12.5px; }
.row .go { grid-column: 3; grid-row: 1 / 3; align-self: center; color: var(--accent); font-size: 12.5px; white-space: nowrap; }

/* All conversations */
.tabs { display: flex; flex-wrap: wrap; gap: 4px 20px; align-items: center; border-bottom: 1px solid var(--rule); }
.tab { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 6px 0; color: var(--ink-2); }
.tab:hover { color: var(--ink); }
.tab[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }
.toggles { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--ink-2); align-items: center; }
.toggles label { display: inline-flex; gap: 6px; align-items: center; }
.focus { display: flex; gap: 10px; align-items: center; font-size: 13px; }
.runs tbody tr { cursor: pointer; }
.runs tbody tr:hover td { background: var(--hover); }
.runs td { font-size: 13px; white-space: nowrap; }
.runs td.verdict { white-space: normal; min-width: 220px; }
.runs .verdict .state { font-weight: 500; }
.runs .why { color: var(--ink-2); font-size: 12px; }
.older { font-size: 11px; color: var(--ink-3); margin-left: 6px; }

/* How the run behaved */
.ops { background: var(--surface-2); }
.ops .cols { gap: 24px 40px; }
.ops table td, .ops table th { padding-block: 7px; font-size: 12.5px; }
.stopped { color: var(--crit-ink); }

/* Tags (drawer) */
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; padding: 1px 7px; border: 1px solid var(--rule-strong); border-radius: 3px; color: var(--ink-2); max-width: 100%; overflow-wrap: break-word; background: var(--sheet); }
.tag.crit { border-color: var(--crit); color: var(--crit-ink); }
.tag.accent { border-color: var(--accent); color: var(--accent); }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }

/* Drawer */
.drawer { position: fixed; inset: 0 0 0 auto; width: min(760px, 100vw); background: var(--sheet); border-left: 1px solid var(--rule); box-shadow: var(--shadow); overflow-y: auto; z-index: 20; padding: calc(22px + env(safe-area-inset-top, 0px)) max(22px, env(safe-area-inset-right, 0px)) calc(40px + env(safe-area-inset-bottom, 0px)) 22px; display: grid; gap: 20px; align-content: start; }
.drawer-head { display: flex; gap: 12px; justify-content: space-between; align-items: start; }
.drawer-head .ids { display: grid; gap: 4px; min-width: 0; overflow-wrap: anywhere; }
.scrim { position: fixed; inset: 0; background: rgba(15, 17, 23, .3); z-index: 19; }
.section { display: grid; gap: 10px; }
.section > h3 { font-size: 12px; font-weight: 600; color: var(--ink-2); border-bottom: 1px solid var(--rule-strong); padding-bottom: 6px; }
.verdict-box ul, .section ul { margin: 0; padding-left: 18px; }
.verdict-box { display: grid; gap: 6px; justify-items: start; }
.verdict-box .state { font-size: 16px; font-weight: 600; }
.evidence { border-left: 2px solid var(--crit); padding: 4px 0 4px 14px; display: grid; gap: 6px; }
.evidence blockquote { margin: 0; padding: 8px 12px; background: var(--surface-2); white-space: pre-wrap; overflow-wrap: anywhere; }
.msgs { display: grid; gap: 0; border-top: 1px solid var(--rule); }
.msg { border-bottom: 1px solid var(--rule); padding: 10px 2px; display: grid; gap: 4px; min-width: 0; }
.msg.student { padding-left: 14px; }
.msg.student .text { color: var(--ink-2); }
.msg.leak { box-shadow: inset 2px 0 0 var(--crit); padding-left: 12px; }
.msg .who { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; font-size: 12px; color: var(--ink-2); }
.msg .text { white-space: pre-wrap; overflow-wrap: anywhere; }
.checks { display: flex; flex-wrap: wrap; gap: 4px 10px; }
.ck { font-size: 11px; color: var(--ink-3); }
.ck.no { color: var(--crit-ink); font-weight: 600; }
.kv { margin: 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; font-size: 13px; }
.kv dt { color: var(--ink-2); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
svg text { fill: var(--ink-2); font-family: var(--font); font-size: 11px; }

/* Tooltip and drop overlay */
.tip { position: fixed; z-index: 40; pointer-events: none; background: var(--ink); color: var(--sheet); font-size: 12px; padding: 6px 9px; border-radius: 4px; max-width: 300px; }
.drop { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: rgba(58, 70, 160, .12); border: 2px dashed var(--accent); font-size: 18px; font-weight: 600; color: var(--ink); }

@media (max-width: 860px) {
  .cols { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 560px) {
  .page { padding-block: 20px 48px; }
  h1 { font-size: 24px; }
  .sec { padding: 22px 16px 24px; }
}
@media (prefers-reduced-motion: no-preference) {
  .drawer { animation: slide .18s ease-out; }
  @keyframes slide { from { transform: translateX(24px); opacity: .6; } }
}
</style>
</head>
<body>
<div class="page" id="app">
  <header class="masthead">
    <div class="mast-text">
      <span class="kicker" data-i18n="kicker">TutorBench · 精品集</span>
      <h1 data-i18n="title">评测运行</h1>
      <p class="source" id="source"></p>
      <p id="banner" class="banner" hidden></p>
    </div>
    <div class="actions">
      <label class="btn-primary" for="pick-folder"><span data-i18n="openFolder">打开 runs 文件夹</span><input type="file" id="pick-folder" webkitdirectory multiple hidden></label>
      <button type="button" id="load-sample" class="btn-quiet" data-i18n="loadSample">载入合成示例</button>
      <button type="button" id="lang-toggle" class="btn-quiet" aria-label="Language">EN</button>
    </div>
  </header>
  <div id="warnings" class="warnings" hidden></div>
  <main class="sheet">
    <section class="sec" id="board" aria-labelledby="board-title"></section>
    <section class="sec" id="attention" aria-labelledby="attention-title"></section>
    <section class="sec" id="runs" aria-labelledby="runs-title"></section>
    <section class="sec ops" id="ops" aria-labelledby="ops-title"></section>
  </main>
</div>
<div id="scrim" class="scrim" hidden></div>
<aside id="drawer" class="drawer" hidden aria-modal="true" role="dialog" aria-labelledby="drawer-title"></aside>
<div id="tip" class="tip" hidden role="status"></div>
<div id="drop" class="drop" hidden data-i18n="dropHere">松开鼠标，载入这个 runs 文件夹</div>
<script src="model.js"></script>
<script src="sample/sample-data.js"></script>
<script src="app.js"></script>
</body>
</html>
