<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Premium Runs</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file:; style-src 'self' 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<style>
/* Layout: a run ledger. Summary strip, then who passed and why, then what needs a person, then every run; details open beside the ledger. */
:root {
  --page: #eef1f7;
  --surface: #ffffff;
  --surface-2: #f5f6fa;
  --ink: #16181f;
  --ink-2: #565c70;
  --rule: #dde1eb;
  --rule-strong: #bfc5d4;
  --accent: #3b4aa8;
  --accent-wash: #e5e8f7;
  --frame: #262934;
  --good: #0aac23;
  --warn: #fbb315;
  --serious: #f18a59;
  --crit: #dc3c3d;
  --good-ink: #006c10;
  --crit-ink: #b3292a;
  --mute: #9aa0b2;
  --shadow: 0 1px 2px rgba(22, 24, 31, .06), 0 8px 24px rgba(22, 24, 31, .06);
  --font: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #0f1117; --surface: #171a21; --surface-2: #1d212a; --ink: #eceef4; --ink-2: #a3a9bb;
    --rule: #2a2f3a; --rule-strong: #3b4150; --accent: #a3adf2; --accent-wash: #262b47; --frame: #3b4150;
    --good-ink: #53c556; --crit-ink: #f07a7b; --mute: #6e7488; --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #0f1117; --surface: #171a21; --surface-2: #1d212a; --ink: #eceef4; --ink-2: #a3a9bb;
  --rule: #2a2f3a; --rule-strong: #3b4150; --accent: #a3adf2; --accent-wash: #262b47; --frame: #3b4150;
  --good-ink: #53c556; --crit-ink: #f07a7b; --mute: #6e7488; --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--page); color: var(--ink); font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1280px; margin: 0 auto; padding-block: 24px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 20px; }
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 650; letter-spacing: -.01em; }
h1 { font-size: 28px; }
h2 { font-size: 16px; }
h3 { font-size: 13px; }
p { margin: 0; }
button, select, .btn { font: inherit; color: inherit; }
button, .btn { cursor: pointer; border: 1px solid var(--rule-strong); background: var(--surface); border-radius: 6px; padding: 6px 12px; line-height: 1.3; }
button:hover, .btn:hover { border-color: var(--accent); }
button:focus-visible, select:focus-visible, .btn:focus-within, [tabindex]:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn-primary { background: var(--accent); color: var(--surface); border-color: var(--accent); }
select { border: 1px solid var(--rule-strong); background: var(--surface); border-radius: 6px; padding: 5px 8px; max-width: 100%; }
.mono { font-family: var(--mono); font-size: 12px; }
.muted { color: var(--ink-2); }
.small { font-size: 12px; }
.num { font-variant-numeric: tabular-nums; }

/* Header */
.top { display: flex; flex-wrap: wrap; align-items: end; gap: 12px 24px; border-top: 2px solid var(--frame); padding-top: 16px; }
.top .title { display: grid; gap: 2px; min-width: 0; }
.kicker { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.top .source { flex: 1 1 260px; min-width: 0; color: var(--ink-2); font-size: 13px; }
.top .actions { display: flex; flex-wrap: wrap; gap: 8px; }
.banner { border: 1px solid var(--rule); border-left: 3px solid var(--accent); background: var(--surface); padding: 10px 14px; border-radius: 6px; color: var(--ink-2); }
.banner strong { color: var(--ink); }
.warnings { border: 1px solid var(--rule); border-left: 3px solid var(--serious); background: var(--surface); padding: 10px 14px; border-radius: 6px; }
.warnings ul { margin: 6px 0 0; padding-left: 18px; }

/* Filters */
.filters { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: end; }
.filters label { display: grid; gap: 4px; font-size: 12px; color: var(--ink-2); min-width: 0; }

/* Summary tiles */
.tiles { display: grid; grid-template-columns: minmax(240px, 1.4fr) repeat(4, minmax(140px, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; }
.tile { background: var(--surface); padding: 16px 18px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.tile .label { font-size: 12px; color: var(--ink-2); }
.tile .value { font-size: 28px; font-weight: 650; letter-spacing: -.02em; line-height: 1.1; }
.tile.hero .value { font-size: 44px; }
.tile .foot { font-size: 12px; color: var(--ink-2); }
.tile button.link { padding: 0; border: 0; background: none; color: var(--accent); text-align: left; }
.split { display: flex; gap: 2px; height: 8px; border-radius: 2px; overflow: hidden; margin-top: 4px; }
.split span { display: block; height: 100%; min-width: 2px; }

/* Panels */
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 18px; display: grid; gap: 14px; min-width: 0; align-content: start; }
.panel header { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; justify-content: space-between; }
.panel header p { color: var(--ink-2); font-size: 12px; max-width: 70ch; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 20px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }

/* Status marks: colour always comes with an icon and a word */
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.dot.scored { background: var(--accent); }
.dot.good { background: var(--good); } .dot.flawed { background: var(--warn); } .dot.fail { background: var(--crit); }
.dot.needs_review { background: transparent; box-shadow: inset 0 0 0 2px var(--accent); }
.dot.error { background: var(--serious); } .dot.student_invalid { background: var(--mute); }
.dot.other_version { background: transparent; box-shadow: inset 0 0 0 2px var(--mute); }
.state { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; padding: 1px 7px; border: 1px solid var(--rule-strong); border-radius: 4px; color: var(--ink-2); max-width: 100%; overflow-wrap: break-word; background: var(--surface); }
.tag.crit { border-color: var(--crit); color: var(--crit-ink); }
.tag.accent { border-color: var(--accent); color: var(--accent); }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }

/* Tutor bars */
.bars { display: grid; gap: 14px; }
.bar-row { display: grid; grid-template-columns: minmax(110px, 160px) minmax(0, 1fr) 64px; gap: 6px 12px; align-items: center; padding: 4px; border-radius: 6px; border: 1px solid transparent; background: none; text-align: left; width: 100%; }
.bar-row:hover, .bar-row.active { border-color: var(--rule-strong); }
.bar-row .name { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.bar-row .rate { text-align: right; font-weight: 650; font-size: 16px; }
.bar-row .meta { grid-column: 2 / 4; font-size: 12px; color: var(--ink-2); }
.track { display: flex; gap: 2px; height: 10px; }
.track span { height: 100%; border-radius: 2px; }
.track .good { background: var(--good); } .track .flawed { background: var(--warn); } .track .fail { background: var(--crit); }
.track .empty { background: var(--surface-2); flex: 1; border: 1px solid var(--rule); }

/* Matrix */
.scroll-x { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { font-size: 12px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
td.num, th.num { text-align: right; }
.matrix td { min-width: 120px; }
.cell-btn { width: 100%; background: none; border: 1px solid transparent; padding: 6px; display: grid; gap: 4px; text-align: left; border-radius: 6px; }
.cell-btn:hover { border-color: var(--rule-strong); }
.cell-btn .track { height: 6px; }
.cell-btn .small { color: var(--ink-2); }

/* Review queue */
.queue { display: grid; gap: 10px; align-content: start; }
.q-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-content: start; align-items: start; gap: 6px 16px; padding: 12px 14px; border: 1px solid var(--rule); border-left: 3px solid var(--accent); border-radius: 6px; background: var(--surface); text-align: left; width: 100%; }
.q-item:hover { border-color: var(--rule-strong); border-left-color: var(--accent); }
.q-item .why { grid-column: 1 / 3; color: var(--ink-2); font-size: 12.5px; }
.empty-note { color: var(--ink-2); padding: 12px 0; }

/* Runs table */
.runs tbody tr { cursor: pointer; }
.runs tbody tr:hover td { background: var(--surface-2); }
.runs td { font-size: 13px; white-space: nowrap; }
.runs td.cell-wrap { white-space: normal; min-width: 220px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border-radius: 999px; padding: 4px 12px; font-size: 12.5px; }
.chip[aria-pressed="true"] { background: var(--accent-wash); border-color: var(--accent); color: var(--ink); }

/* Judges */
.judge-bars { display: grid; gap: 10px; }
.jb { display: grid; grid-template-columns: minmax(80px, 140px) minmax(0, 1fr) 48px; gap: 10px; align-items: center; }
.jb .fill { height: 8px; border-radius: 0 2px 2px 0; background: var(--accent); }
.jb .base { border-left: 1px solid var(--rule-strong); }

/* Drawer */
.drawer { position: fixed; inset: 0 0 0 auto; width: min(760px, 100vw); background: var(--surface); border-left: 1px solid var(--rule); box-shadow: var(--shadow); overflow-y: auto; z-index: 20; padding: calc(20px + env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) calc(40px + env(safe-area-inset-bottom, 0px)) 20px; display: grid; gap: 18px; align-content: start; }
.drawer-head { display: flex; gap: 12px; justify-content: space-between; align-items: start; }
.drawer-head .ids { display: grid; gap: 4px; min-width: 0; overflow-wrap: anywhere; }
.scrim { position: fixed; inset: 0; background: rgba(15, 17, 23, .28); z-index: 19; }
.section { display: grid; gap: 10px; }
.section > h3 { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); border-bottom: 1px solid var(--rule); padding-bottom: 6px; }
.verdict-box ul, .section ul { margin: 0; padding-left: 18px; }
.verdict-box { border: 1px solid var(--rule); border-radius: 8px; padding: 12px 14px; display: grid; gap: 6px; justify-items: start; }
.evidence { border: 1px solid var(--rule); border-left: 3px solid var(--crit); border-radius: 6px; padding: 10px 12px; display: grid; gap: 6px; }
.evidence blockquote { margin: 0; padding: 6px 10px; background: var(--surface-2); border-radius: 4px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msgs { display: grid; gap: 8px; }
.msg { border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; display: grid; gap: 6px; min-width: 0; }
.msg.student { background: var(--surface-2); }
.msg.leak { border-color: var(--crit); box-shadow: inset 3px 0 0 var(--crit); }
.msg .who { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 12px; color: var(--ink-2); }
.msg .text { white-space: pre-wrap; overflow-wrap: anywhere; }
.checks { display: flex; flex-wrap: wrap; gap: 4px; }
.ck { font-size: 11px; padding: 0 6px; border-radius: 3px; border: 1px solid var(--rule); color: var(--ink-2); }
.ck.no { border-color: var(--crit); color: var(--crit-ink); }
.kv { margin: 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; font-size: 13px; }
.kv dt { color: var(--ink-2); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
svg text { fill: var(--ink-2); font-family: var(--font); font-size: 11px; }

/* Tooltip and drop overlay */
.tip { position: fixed; z-index: 40; pointer-events: none; background: var(--ink); color: var(--surface); font-size: 12px; padding: 6px 9px; border-radius: 6px; max-width: 280px; }
.drop { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: rgba(59, 74, 168, .12); border: 3px dashed var(--accent); font-size: 18px; font-weight: 600; color: var(--ink); }

@media (max-width: 900px) {
  .grid2 { grid-template-columns: minmax(0, 1fr); }
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tile.hero { grid-column: 1 / -1; }
}
@media (max-width: 520px) {
  .bar-row { grid-template-columns: minmax(0, 1fr) 56px; }
  .bar-row .track { grid-column: 1 / 3; grid-row: 2; }
  .bar-row .meta { grid-column: 1 / 3; }
  .tile.hero .value { font-size: 36px; }
}
@media (prefers-reduced-motion: no-preference) {
  .drawer { animation: slide .18s ease-out; }
  @keyframes slide { from { transform: translateX(24px); opacity: .6; } }
}
</style>
</head>
<body>
<div class="wrap" id="app">
  <header class="top">
    <div class="title">
      <span class="kicker">TutorBench · Premium quick-test</span>
      <h1 data-i18n="title">评测运行</h1>
    </div>
    <p class="source" id="source"></p>
    <div class="actions">
      <label class="btn btn-primary" for="pick-folder"><span data-i18n="openFolder">打开 runs 文件夹</span><input type="file" id="pick-folder" webkitdirectory multiple hidden></label>
      <button type="button" id="load-sample" data-i18n="loadSample">载入合成示例</button>
      <button type="button" id="lang-toggle" aria-label="Language">EN</button>
    </div>
  </header>
  <div id="banner" class="banner" hidden></div>
  <div id="warnings" class="warnings" hidden></div>
  <section class="filters" id="filters" aria-label="Filters"></section>
  <section class="tiles" id="tiles" aria-label="Summary"></section>
  <div class="grid2">
    <section class="panel" id="tutors"></section>
    <section class="panel" id="matrix"></section>
  </div>
  <section class="panel" id="review"></section>
  <div class="grid2">
    <section class="panel" id="judges"></section>
    <section class="panel" id="batches"></section>
  </div>
  <section class="panel" id="runs"></section>
</div>
<div id="scrim" class="scrim" hidden></div>
<aside id="drawer" class="drawer" hidden aria-modal="true" role="dialog" aria-labelledby="drawer-title"></aside>
<div id="tip" class="tip" hidden role="status"></div>
<div id="drop" class="drop" hidden data-i18n="dropHere">松开鼠标，载入这个 runs 文件夹</div>
<script src="model.js"></script>
<script src="sample/sample-data.js"></script>
<script src="app.js"></script>
</body>
</html>
